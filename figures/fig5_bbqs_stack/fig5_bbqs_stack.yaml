# Links and build steps of Fig. 5 for tools/pptx2svg.py (run: make fig5).
# The .pptx is the editable source of the drawing; this file adds what
# PowerPoint does not keep well: a link for every element, and the Inkscape
# layers (steps) which fig5_bbqs_stack.svgtune shows one after another.
source: fig5_bbqs_stack_design.pptx
output: fig5_bbqs_stack.svg
title: "Fig. 5: The BBQS standards stack"

# Shape name (regex) -> step; the first match wins, everything else is "base"
# (legend, layer rows and their titles).
steps:
  - [gaps, '^Behavior labels$|^Data without a standard$']
  - [data, '^Data: |^Text 78$']
  - [nwb-format, '^(Bus|Feed|Join) A$|^HDF5 Zarr$|^Video formats$']
  - [nwb-file, '^NWB$|^NWB extension: |^HDMF$']
  - [nwb-dataset, '^DANDI layout$']
  - [archive, '^EMBER$|^JSON Schema']
  - [bids-format, '^(Bus|Feed|Join) B$|^NIfTI$|^EDF$|^JSON TSV$|^BIDS media$']
  - [bids-dataset, '^BIDS$|^BIDS BEP0|^BIDS schema$|^NWB in BIDS$|^Text 48$']
  - [companion, '^BIDS Multi-subject BEP$|^Companion proposals|^Text 58$']
  - [psychds, '^Path C$|^(Bus|Feed|Join) C$|^CSV JSON$|^Psych-DS$|^LinkML$']
  - [ontologies, '^HED$|^Neuro Termsets|^Terminology: ']

# Long paths are cut where they enter a box, so each part shows with its step.
split:
  'Path A: data to NWB': {at: [449.3], steps: [nwb-format, nwb-file]}
  'Path A: NWB to EMBER': {at: [119.5], steps: [nwb-dataset, archive]}
  'Path B': {at: [449.3], steps: [bids-format, bids-dataset]}

