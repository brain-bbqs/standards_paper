# Seed nodes for the neuroscience data standards ecosystem knowledge graph.
#
# Initial list compiled from the SfN 2025 poster, the paper notes, and the BBQS data
# standards guideline. Draft: every entry needs review by someone who knows the resource.
#
# Fields
#   id            stable slug used by curated_edges.yaml
#   name          full name
#   abbreviation  short name used in figures (optional)
#   layer         primary layer (see taxonomy.yaml `layers`)
#   also_layers   other layers the technology also spans (fuzzy boundaries, e.g., DICOM)
#   kind          optional sub-type, used mainly in the ontology_terminology layer
#   communities   one or more communities (see taxonomy.yaml `communities`); the FIRST
#                 entry is the node's home community, used for strict edge classification
#   rrid          SciCrunch RRID (SCR_xxxxxx). Only IDs whose resolved name was checked
#                 are filled in; null = not yet looked up (run `ecokg rrid-check`).
#   rrid_aliases  further RRIDs registered for the same resource (duplicate registry records);
#                 optional. Edges to any alias are attributed to this node.
#   fairsharing   FAIRsharing DOI suffix (e.g., FAIRsharing.abc123); null = resolve via
#                 `ecokg harvest-fairsharing --resolve` (needs a FAIRsharing account).
#   homepage      landing page
#   sources       where the node comes from: poster | notes | guideline | bbqs_inventory | expert

