# Expert-curated relationships between seed nodes.
#
# These capture relationships documented in the poster, the paper notes, the BBQS
# guideline, or the standards' own documentation. Registries (FAIRsharing, RRID) often
# do not record them; comparing curated vs. registry edges is part of the gap analysis.
#
# Fields
#   source, target  node ids from seeds.yaml (direction: source <relation> target)
#   relation        see taxonomy.yaml `relations`
#   provenance      poster | notes | guideline | docs | expert
#   evidence        short justification and/or URL
#   confidence      high | medium | low
#   verified        false until a domain expert confirms the edge (record who in `verified_by`)
#
# DRAFT: initial edges compiled by Claude from the project materials. Every edge needs
# expert verification before being used in the paper.

