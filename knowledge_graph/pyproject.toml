[project]
name = "ecokg"
version = "0.1.0"
description = "Knowledge graph of the neuroscience data standards ecosystem (FAIRsharing + RRID + expert curation)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "requests>=2.31",
    "networkx>=3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ecokg = "ecokg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecokg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
